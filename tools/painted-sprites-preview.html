<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fishtank · 全套像素图鉴</title>
<style>*{box-sizing:border-box}body{margin:0;background:#102638;color:#eee6d0;font:15px/1.6 system-ui}main{max-width:1250px;margin:30px auto;padding:0 24px}h1,h2{color:#f0c66e}p{color:#b5ccd0}.toolbar{position:sticky;top:0;background:#102638;padding:12px 0;z-index:2}button{background:#224555;border:1px solid #60818b;color:#eee6d0;padding:8px 16px;margin:0 8px 8px 0;cursor:pointer}button.active{background:#8cc5a5;color:#142f40}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{border:1px solid #44636f;background:#173b50;padding:12px}.large{height:160px;display:flex;justify-content:center;align-items:center}.large img{width:192px;height:144px;object-fit:contain}.card.decor .large img{width:144px;height:144px}.actual{height:80px;border-top:1px solid #44636f;display:flex;align-items:center;justify-content:center}.caption{font-size:12px;color:#b5ccd0}img{image-rendering:pixelated}#tanks{display:flex;flex-wrap:wrap;gap:20px}.tankwrap{overflow:auto;max-width:100%}.tank-label{display:none}.tank{position:relative;overflow:hidden;background:linear-gradient(#20546b,#153c50);border:3px solid #7797a0;box-shadow:inset 0 0 0 2px #466c76}.sand{position:absolute;bottom:0;width:100%;height:12%;background:#b39a72}.tank img{position:absolute;object-fit:fill}.tank-label{margin:6px 0 18px}.grades{display:flex;justify-content:space-around;height:28px;align-items:center}.grades img{width:32px;height:24px}</style>
<main><h1>全套像素图鉴 · 29 个物种 / 18 件装饰</h1><p>与 App 共用原生像素采样、品阶变色和动画帧。每张卡片上方为放大图，下方为小鱼缸中的尺寸；真实存档未参与预览。</p><div class="toolbar"><button id="motion" class="active">动画：开</button><button id="small" class="active">小缸 320×180</button><button id="medium">中缸 640×360</button><button id="large">大缸 960×540</button></div><h2>鱼缸尺寸对照</h2><div id="tanks"></div><h2>全部物种</h2><p>每张卡片最下方显示五种品阶配色。</p><div id="fish" class="grid"></div><h2>全部装饰</h2><div id="decor" class="grid"></div></main>
<script>let data=[],moving=true,scale=1;const animated=[], urls=new Map(); async function preload(names){const queue=[...new Set(names)];await Promise.all(Array.from({length:4},async()=>{while(queue.length){const name=queue.shift();for(let retry=0;retry<3;retry++){try{const r=await fetch(name,{cache:"no-cache"});if(!r.ok)throw Error(name);urls.set(name,URL.createObjectURL(await r.blob()));break}catch(e){if(retry===2)throw e}}}}))};function sprite(s,w,h){const im=new Image();im.src=urls.get(s.id+'-0.png');im.alt=s.name;im.style.width=w+'px';im.style.height=h+'px';if(s.frames>1)animated.push([im,s]);return im}function cards(){for(const s of data){const card=document.createElement('article');card.className='card '+s.kind;card.innerHTML='<b>'+s.name+'</b><div class="large"></div><div class="actual"></div><div class="caption">小缸尺寸 · '+Math.round(s.width)+'×'+Math.round(s.height)+'</div>';card.children[1].append(sprite(s,s.kind==='fish'?192:s.width*Math.min(192/s.width,144/s.height),s.kind==='fish'?144:s.height*Math.min(192/s.width,144/s.height)));card.children[2].append(sprite(s,s.width,s.height));if(s.kind==='fish'){const g=document.createElement('div');g.className='grades';for(let i=1;i<=5;i++){const im=new Image();im.src=urls.get(s.id+'-grade-'+i+'.png');im.alt=s.name+' 品阶 '+i;g.append(im)}card.append(g)}document.getElementById(s.kind).append(card)}}function tanks(){const root=document.getElementById('tanks');root.replaceChildren();const fish=data.filter(s=>s.kind==='fish'),decor=data.filter(s=>s.kind==='decor');for(let batch=0;batch<3;batch++){const wrap=document.createElement('div');wrap.className='tankwrap';const tank=document.createElement('div');tank.className='tank';tank.style.width=320*scale+'px';tank.style.height=180*scale+'px';tank.innerHTML='<div class="sand"></div>';const props=decor.slice(batch*6,batch*6+6);props.forEach((s,i)=>{const im=sprite(s,s.width*scale,s.height*scale);im.style.left=(8+i*50)*scale+'px';im.style.top=(s.top?0:163-s.height)*scale+'px';tank.append(im)});fish.slice(batch*10,batch*10+10).forEach((s,i)=>{const im=sprite(s,32*scale,24*scale);im.style.left=(12+i%5*61)*scale+'px';im.style.top=(43+Math.floor(i/5)*43)*scale+'px';tank.append(im)});wrap.append(tank);root.append(wrap);const caption=document.createElement('p');caption.className='tank-label';caption.textContent='场景 '+(batch+1)+' · '+320*scale+' × '+180*scale;root.append(caption)}}fetch('catalog.json').then(r=>r.json()).then(async d=>{data=d;const initial=d.flatMap(s=>[s.id+'-0.png',...(s.kind==='fish'?[1,2,3,4,5].map(g=>s.id+'-grade-'+g+'.png'):[])]);await preload(initial);cards();tanks();document.body.dataset.ready='true';await preload(d.flatMap(s=>Array.from({length:s.frames},(_,f)=>s.id+'-'+f+'.png')));document.body.dataset.animationReady='true'}).catch(e=>{document.getElementById('tanks').textContent='预览载入失败，请刷新重试。'});document.getElementById('motion').onclick=e=>{moving=!moving;e.target.textContent='动画：'+(moving?'开':'关');e.target.classList.toggle('active',moving)};['small','medium','large'].forEach((id,i)=>document.getElementById(id).onclick=()=>{scale=i+1;tanks();['small','medium','large'].forEach(s=>document.getElementById(s).classList.toggle('active',s===id))});setInterval(()=>{if(!moving)return;const t=performance.now()/1000;for(const [im,s]of animated){if(!im.isConnected)continue;const n=Math.floor(t*(s.fps||16))%s.frames;const url=urls.get(s.id+'-'+n+'.png');if(url&&im.src!==url)im.src=url}},33);</script></html>
